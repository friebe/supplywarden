<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>supplywarden</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f5f2;
      --card: #fffcf8;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e6e2da;
      --amber: #9a3412;
      --amber-bg: #fff4e8;
      --blue: #1e3a8a;
      --rose: #9f1239;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141210;
        --card: #1c1917;
        --ink: #fafaf9;
        --muted: #a8a29e;
        --line: #44403c;
        --amber: #fdba74;
        --amber-bg: #2a2118;
        --blue: #93c5fd;
        --rose: #fda4af;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
    }
    main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 16px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .counts { display: flex; gap: 8px; margin: 18px 0 0; }
    .counts button {
      font: inherit;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px 10px;
      min-width: 92px;
      text-align: left;
      cursor: pointer;
    }
    .counts button.on { border-color: var(--ink); }
    .counts .n { display: block; font-size: 22px; font-weight: 650; letter-spacing: -0.04em; line-height: 1.1; }
    .counts .l { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .clear { margin: 16px 0 0; color: var(--muted); }
    section { margin-top: 26px; }
    h2 { font-size: 12px; font-weight: 650; margin: 0 0 4px; }
    .note { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    .sev.high, .sev.critical { color: var(--rose); }
    .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .sheet { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
      background: var(--card);
    }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 7px 10px;
    }
    td { padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
    .name { font-weight: 650; }
    .name a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
    .name a:hover { text-decoration-color: var(--ink); }
    td.via details > summary { cursor: pointer; }
    td.via details > summary::marker { color: var(--muted); }
    td.via .trail { margin-top: 6px; }
    td.via .trail code { white-space: normal; }
    tr.mismatch { background: var(--amber-bg); }
    tr.mismatch .pin { color: var(--amber); font-weight: 650; }
    td code { display: block; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    td.do code { color: var(--ink); margin-bottom: 4px; }
    td.do .sub { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>supplywarden</h1>
    <div class="meta" id="meta"></div>
    <div class="counts" id="counts"></div>
    <p class="clear" id="clear" hidden>Nothing to upgrade or pin.</p>
    <div id="out"></div>
  </main>
  <script type="application/json" id="supplywarden-data"><!--SUPPLYWARDEN_DATA--></script>
  <script>
    const report = JSON.parse(document.getElementById("supplywarden-data").textContent || "{}");
    const entries = report.entries || [];
    const order = { upgrade: 0, override: 1, wait: 2, drop: 3, keep: 4 };
    const todoActions = new Set(["upgrade", "override", "wait"]);

    const parts = String(report.cwd || "").split(/[/\\]/).filter(Boolean);
    const where = parts[parts.length - 1] || "";
    document.getElementById("meta").textContent = [report.generatedAt, where].filter(Boolean).join(" · ");

    function nameOf(spec) {
      const at = String(spec).lastIndexOf("@");
      return at > 0 ? spec.slice(0, at) : spec;
    }
    function via(entry) {
      const roots = (entry.roots || []).map(nameOf).filter((name) => name !== entry.package);
      if (roots.length) {
        const shown = roots.slice(0, 2).join(", ");
        return roots.length > 2 ? shown + " +" + (roots.length - 2) : shown;
      }
      return (entry.roots || []).length ? "direct" : "";
    }
    function viaCell(entry) {
      const td = el("td", "via");
      const label = via(entry) || "—";
      const trails = (entry.trails || []).filter((trail) => trail.path && (trail.path.includes("→") || trail.range));
      if (!trails.length) {
        td.textContent = label;
        return td;
      }
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = label;
      details.append(summary);
      for (const trail of trails) {
        const line = el("div", "trail");
        line.append(el("code", "", trail.path));
        if (trail.range) line.append(el("div", "sub", "asks for " + entry.package + "@" + trail.range));
        details.append(line);
      }
      td.append(details);
      return td;
    }
    function firstSentence(text) {
      const value = String(text || "").trim();
      const cut = value.search(/\.\s/);
      return cut === -1 ? value : value.slice(0, cut + 1);
    }
    function exactPin(pin) {
      return typeof pin === "string" && /^\d+\.\d+\.\d+/.test(pin);
    }
    function offPin(entry) {
      if (!exactPin(entry.forcedVersion) || !(entry.installed || []).length) return false;
      return entry.installed.some((version) => version !== entry.forcedVersion);
    }
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }
    function nameCell(entry) {
      const td = el("td", "name");
      const a = document.createElement("a");
      const installed = (entry.installed || []).filter(Boolean);
      const version = installed.length === 1 ? "/v/" + installed[0] : "";
      a.href = "https://npmx.dev/package/" + entry.package + version;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = entry.package;
      td.append(a);
      return td;
    }

    const groups = {
      todo: entries.filter((entry) => todoActions.has(entry.action)).sort((a, b) => order[a.action] - order[b.action] || a.package.localeCompare(b.package)),
      drop: entries.filter((entry) => entry.action === "drop").sort((a, b) => a.package.localeCompare(b.package)),
      keep: entries.filter((entry) => entry.action === "keep").sort((a, b) => Number(offPin(b)) - Number(offPin(a)) || a.package.localeCompare(b.package)),
    };

    let current = "all";
    const counts = document.getElementById("counts");
    const choices = [
      ["todo", groups.todo.length, "To do"],
      ["drop", groups.drop.length, "Unused"],
      ["keep", groups.keep.length, "Holding"],
    ];
    for (const [key, count, label] of choices) {
      if (key !== "todo" && count === 0) continue;
      const button = document.createElement("button");
      button.type = "button";
      button.append(el("span", "n", String(count)), el("span", "l", label));
      button.addEventListener("click", () => {
        current = current === key ? "all" : key;
        for (const other of counts.querySelectorAll("button")) other.classList.toggle("on", other === button && current === key);
        draw();
      });
      counts.appendChild(button);
    }

    function table(headers, rows) {
      const sheet = el("div", "sheet");
      const wrap = document.createElement("table");
      const head = document.createElement("thead");
      const hr = document.createElement("tr");
      for (const header of headers) hr.append(el("th", "", header));
      head.append(hr);
      wrap.append(head);
      const body = document.createElement("tbody");
      for (const row of rows) body.append(row);
      wrap.append(body);
      sheet.append(wrap);
      return sheet;
    }

    function draw() {
      const out = document.getElementById("out");
      out.replaceChildren();
      const showTodo = current === "all" || current === "todo";
      const showDrop = (current === "all" || current === "drop") && groups.drop.length;
      const showKeep = (current === "all" || current === "keep") && groups.keep.length;
      document.getElementById("clear").hidden = !(showTodo && groups.todo.length === 0);

      if (showTodo && groups.todo.length) {
        const section = document.createElement("section");
        section.append(el("h2", "", "To do"));
        section.append(table(["Package", "Action", "Via", "Do"], groups.todo.map((entry) => {
          const tr = document.createElement("tr");
          const action = document.createElement("td");
          action.append(el("div", "", entry.action));
          if (entry.severity && entry.severity !== "unknown") action.append(el("div", "sub sev " + entry.severity, entry.severity));
          if (entry.dependencyKind && entry.dependencyKind !== "production") action.append(el("div", "sub", entry.dependencyKind));
          const from = viaCell(entry);
          const done = el("td", "do");
          const command = (entry.commands || [])[0];
          if (command) done.append(el("code", "", command));
          const why = firstSentence(entry.summary);
          if (why) done.append(el("div", "sub", why));
          tr.append(nameCell(entry), action, from, done);
          return tr;
        })));
        out.append(section);
      }
      if (showDrop) {
        const section = document.createElement("section");
        section.append(el("h2", "", "Unused"), el("p", "note", "These overrides do not change what is installed."));
        section.append(table(["Package", "Why", "Do"], groups.drop.map((entry) => {
          const tr = document.createElement("tr");
          const done = el("td", "do");
          const command = (entry.commands || [])[0];
          if (command) done.append(el("code", "", command));
          tr.append(nameCell(entry), el("td", "", firstSentence(entry.summary)), done);
          return tr;
        })));
        out.append(section);
      }
      if (showKeep) {
        const section = document.createElement("section");
        const drifted = groups.keep.some(offPin);
        section.append(el("h2", "", "Holding"));
        section.append(el("p", "note", drifted
          ? "The audit is quiet. Highlighted rows are installed on a different version than the pin."
          : "The audit is quiet. These pins are what is installed."));
        section.append(table(["Package", "Installed", "Pin", "Via"], groups.keep.map((entry) => {
          const tr = document.createElement("tr");
          if (offPin(entry)) tr.className = "mismatch";
          tr.append(
            nameCell(entry),
            el("td", "", (entry.installed || []).join(", ") || "—"),
            el("td", "pin", entry.forcedVersion || "—"),
            viaCell(entry),
          );
          return tr;
        })));
        out.append(section);
      }
      if (!entries.length) {
        out.append(el("p", "clear", "Nothing in the audit, and no overrides in package.json."));
        document.getElementById("clear").hidden = true;
      }
    }
    draw();
  </script>
</body>
</html>
